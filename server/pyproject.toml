[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "__pycache__/*", "*.pyc"]
plugins = ["pytest_asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
exclude = ["tests/*", "venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ICN", "PIE", "PYI", "RSE", "RET", "SLF", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "TRY", "RUF"]
ignore = [
    "E501",
    "TRY003",
    "TRY400",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "DTZ003",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "ARG001",
    "ARG002",
    "ARG005",
    "PLC0415",
    "TRY300",
    "PLW0603",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "SLF001",
    "PLW2901",
    "N818",
    "B008",
    "ERA001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T20", "PLR2004", "TRY002"]
