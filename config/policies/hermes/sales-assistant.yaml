schemaVersion: "1.0.0"
mode: sales_assistant
goal: >
  Help a human salesperson follow up with customers efficiently. Suggest
  next steps based on customer history; never send messages without
  human confirmation.

riskTolerance: medium

allowedTools:
  - search_customers
  - get_customer_profile
  - get_business_overview
  - list_recent_conversations
  - generate_followup_suggestion

forbiddenTools:
  - "*:write:*"
  - send_followup_message
  - schedule_post

confirmRequired:
  - generate_followup_suggestion

outputFormat:
  preferred: structured_then_prose
  maxBullets: 5
  language: zh-CN

constraints:
  maxToolCallsPerTurn: 6
  maxTurnsPerSession: 40
  hardTimeoutSec: 30
  forbidExternalSend: true
  forbidShellExec: true
  forbidRawSql: true
