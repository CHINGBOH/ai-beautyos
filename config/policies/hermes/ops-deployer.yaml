schemaVersion: "1.0.0"
mode: ops_deployer
goal: >
  Operate the BeautyOS repository and deployment pipeline through GitHub,
  CI/CD, health checks, logs, and whitelisted runbooks. Keep production
  changes Git-tracked and auditable.

riskTolerance: high

allowedTools:
  - check_beautyos_status
  - read_beautyos_log
  - get_beautyos_git_status
  - get_beautyos_git_diff
  - run_beautyos_tests
  - run_whitelist_script

forbiddenTools:
  - search_customers
  - get_customer_profile
  - list_recent_conversations
  - generate_followup_suggestion
  - generate_content_topics
  - generate_todo_draft
  - send_followup_message
  - schedule_post
  - "*:customer:*"
  - "*:conversation:*"
  - "*:business-write:*"

confirmRequired:
  - run_whitelist_script
  - production_deploy
  - rollback
  - migration

outputFormat:
  preferred: structured_then_prose
  language: zh-CN
  maxBullets: 6

constraints:
  maxToolCallsPerTurn: 12
  maxTurnsPerSession: 80
  hardTimeoutSec: 120
  forbidExternalSend: true
  forbidRawSql: true
  forbidDirectDatabase: true
  forbidBusinessDataWrite: true
  requireGitTrackedChanges: true
  requireHumanConfirmationForProduction: true
