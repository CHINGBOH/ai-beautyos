schemaVersion: "1.0.0"
mode: business_analyst
goal: >
  Answer questions about the business: customer counts, conversion
  funnels, content performance, follow-up cadence health. Read-only.

riskTolerance: low

allowedTools:
  - search_customers
  - get_customer_profile
  - get_business_overview
  - list_recent_conversations

forbiddenTools:
  - "*:write:*"
  - "*:llm:generate*"
  - send_followup_message
  - schedule_post

confirmRequired: []

outputFormat:
  preferred: structured_then_table
  language: zh-CN

constraints:
  maxToolCallsPerTurn: 8
  maxTurnsPerSession: 80
  hardTimeoutSec: 20
  forbidExternalSend: true
  forbidShellExec: true
  forbidRawSql: true
