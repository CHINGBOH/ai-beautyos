# Worked example referenced by docs/architecture/config-architecture.md
# Cadence is config; the *decision to send* is still gated in code.

version: "1.0.0"

cadences:
  vip:
    initial_followup_after_days: 1
    nurture_interval_days: 7
    inactive_followup_days: 14
  regular:
    initial_followup_after_days: 3
    nurture_interval_days: 14
    inactive_followup_days: 30
  cold:
    initial_followup_after_days: 7
    nurture_interval_days: 30
    inactive_followup_days: 60

default_tone: friendly_professional

# Allowed tone overrides — Hermes / users may pick one of these.
allowed_tones:
  - friendly_professional
  - warm_concierge
  - direct_and_brief
  - educational
