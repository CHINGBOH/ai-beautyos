schemaVersion: "1.0.0"
name: list_recent_conversations
description: 列出最近的客户对话/沟通记录，可按客户筛选
risk: low
access: ro
timeoutMs: 5000
maxRows: 30
rateLimitPerMin: 60
requiresConfirm: false
supportsDryRun: false
input:
  customerId: { type: string, required: false }
  limit: { type: number, required: false, default: 10, max: 30 }
output:
  rows:
    - { id: string, customerId: string, channel: string, snippet: string, at: string }
audit: summary
tags:
  - "conversation:read"
