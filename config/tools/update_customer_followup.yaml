schemaVersion: "1.0.0"
name: update_customer_followup
description: 更新客户跟进状态、下次跟进时间、备注或客户等级，需要 dry-run/确认
risk: medium
access: rw
timeoutMs: 10000
maxRows: 0
rateLimitPerMin: 20
requiresConfirm: true
supportsDryRun: true
input:
  customerId: { type: number, required: true }
  status: { type: string, required: false }
  followUpDate: { type: string, required: false, format: date-time }
  notes: { type: string, required: false, maxLength: 2000 }
  customerTier: { type: string, required: false, enum: ["A", "B", "C", "D"] }
output:
  success: boolean
  customer: object
audit: full
tags:
  - "customer:write"
