schemaVersion: "1.0.0"
name: create_content_draft
description: 生成并保存小红书/私域内容草稿，需要 dry-run 预览或人工确认
risk: medium
access: rw
timeoutMs: 45000
maxRows: 0
rateLimitPerMin: 5
requiresConfirm: true
supportsDryRun: true
input:
  type: { type: string, required: true, enum: ["project", "case", "price", "guide", "holiday", "new_product"] }
  project: { type: string, required: false, maxLength: 200 }
  keywords: { type: array, required: false }
  tone: { type: string, required: false, enum: ["enthusiastic", "professional", "casual"] }
  useCache: { type: boolean, required: false, default: true }
output:
  postId: number
  title: string
  content: string
  tags: array
  validation: object
audit: full
tags:
  - "content:write"
  - "llm:generate"
