schemaVersion: "1.0.0"
name: get_customer_profile
description: 取单个客户的完整画像（基本信息 + 标签 + 最近互动摘要）
risk: low
access: ro
timeoutMs: 5000
maxRows: 0
rateLimitPerMin: 120
requiresConfirm: false
supportsDryRun: false
input:
  customerId: { type: string, required: true }
output:
  id: string
  name: string
  tags: { type: string[] }
  lastFiveInteractions: { type: array }
audit: summary
tags:
  - "customer:read"
