schemaVersion: "1.0.0"
name: search_customers
description: 按姓名 / 标签 / 渠道 模糊搜索客户列表
risk: low
access: ro
timeoutMs: 5000
maxRows: 50
rateLimitPerMin: 60
requiresConfirm: false
supportsDryRun: false
input:
  query: { type: string, required: true, maxLength: 64 }
  channel: { type: string, required: false }
  limit: { type: number, required: false, default: 20, max: 50 }
output:
  rows:
    - { id: string, name: string, channel: string, lastContactAt: string }
  total: number
audit: summary
tags:
  - "customer:read"
