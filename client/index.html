<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LUMIÈRE | 高端医美定制</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>

  <body style="margin:0;min-height:100vh;background:#fbf8f3;">
    <div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#6f5847;">
      <p id="root-fallback" style="letter-spacing:0.18em;">LUMIÈRE</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const analyticsEndpoint = window.__VITE_ANALYTICS_ENDPOINT__ || "";
      const analyticsWebsiteId = window.__VITE_ANALYTICS_WEBSITE_ID__ || "";
      if (analyticsEndpoint && analyticsWebsiteId) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${analyticsEndpoint}/umami`;
        script.setAttribute("data-website-id", analyticsWebsiteId);
        document.head.appendChild(script);
      }
    </script>
  </body>

</html>
