name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  BASE_URL: http://localhost:8000

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      api:
        image: ghcr.io/${{ github.repository }}/medical-crm-api:latest
        ports:
          - 8000:8000
        env:
          ENVIRONMENT: test
          REDIS_URL: redis://redis:6379/0
        options: >-
          --health-cmd "curl -f http://localhost:8000/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
        working-directory: e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health/live && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
        working-directory: e2e

      - name: Run E2E tests
        run: npx playwright test --reporter=list --project=chromium
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/reports/
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 14

      - name: Generate test report
        if: always()
        run: |
          npx playwright show-report --report-dir e2e/reports || true
        working-directory: e2e
