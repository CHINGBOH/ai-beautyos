# =============================================================================
# AI BeautyOS — single-host Docker Compose deployment
# =============================================================================
# Usage:
#   cp .env.example .env             # fill in secrets
#   docker compose up -d --build     # build + start web + postgres
#   docker compose ps                # see health
#   docker compose logs -f web       # tail web logs
#
# Notes:
#   * Postgres is reachable only on the internal Compose network — no host
#     port is published.
#   * Web is the only service exposed to the host (default 3000). Put a
#     reverse proxy (nginx / Caddy / Traefik) in front of it for TLS.
#   * GIT_COMMIT is stamped into the image label and surfaced at /healthz so
#     every running container can be traced back to a Git commit.
# =============================================================================

name: beautyos

services:
  postgres:
    # Vanilla postgres:16 won't work — `pnpm db:pgvector` requires the
    # `vector` extension for knowledge / RAG features. The pgvector image
    # is a drop-in replacement that ships the extension pre-installed.
    image: pgvector/pgvector:pg16
    container_name: beautyos-postgres
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautyos}
      POSTGRES_DB: ${POSTGRES_DB:-beautyos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - beautyos-internal
    # No `ports:` on purpose — the DB must not be exposed to the host. Use
    # `docker compose exec postgres psql ...` for admin access.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-beautyos}" -d "${POSTGRES_DB:-beautyos}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: ai-beautyos:${IMAGE_TAG:-local}
    container_name: beautyos-web
    restart: unless-stopped
    # Resource governance — see docs/deployment/runtime-governance.md.
    # mem_limit triggers OOM-kill at the container boundary; NODE_OPTIONS
    # caps V8's heap below that so we get a clean OOM with a stacktrace
    # instead of an opaque SIGKILL. cpus caps CPU so a runaway endpoint
    # cannot starve postgres on the same host.
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    stop_grace_period: 20s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Keep V8 below mem_limit. Override here, not in the Dockerfile.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      # Inside the Compose network the DB host is the service name. We
      # override DATABASE_URL here so operators only have to set credentials
      # in .env, not the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-beautyos}:${POSTGRES_PASSWORD:-beautyos}@postgres:5432/${POSTGRES_DB:-beautyos}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beautyos-internal
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null --spider http://127.0.0.1:3000/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Standalone MCP Tool Server (Phase-3).
  # Same image as `web`, different entrypoint. Internal-network only —
  # no public port. Hermes / other callers inside the compose network reach
  # it at http://tool-server:5001/tools/*.
  #
  # To route /tools/* away from `web` and onto this service:
  #   1. set BEAUTYOS_DISABLE_EMBEDDED_TOOL_SERVER=1 on web (in .env)
  #   2. point Hermes / clients at http://tool-server:5001
  # Until then, both /tools endpoints exist and serve identical logic.
  # ---------------------------------------------------------------------------
  tool-server:
    image: ai-beautyos:${IMAGE_TAG:-local}
    container_name: beautyos-tool-server
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 1.0
    stop_grace_period: 20s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TOOL_SERVER_PORT: "5001"
      NODE_OPTIONS: ${NODE_OPTIONS_TOOL_SERVER:---max-old-space-size=256}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beautyos}:${POSTGRES_PASSWORD:-beautyos}@postgres:5432/${POSTGRES_DB:-beautyos}
    # No `ports:` block — internal-only by design (principle #6).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beautyos-internal
    command: ["node", "dist/tool-server-main.js"]
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null --spider http://127.0.0.1:5001/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  beautyos-internal:
    driver: bridge

volumes:
  postgres-data:
    driver: local
