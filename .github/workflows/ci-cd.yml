name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff mypy pyright

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy .

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  frontend-lint:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npx vitest run

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-lint]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/medical-crm-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/medical-crm-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Create K8s secrets
        run: |
          kubectl create secret generic medical-crm-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            --from-literal=KIMI_API_KEY="${{ secrets.KIMI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to K8s
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            server/k8s/deployment.yaml
            server/k8s/cronjobs.yaml
          images: |
            ghcr.io/${{ github.repository }}/medical-crm-api:${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.lumieremedical.com

    steps:
      - uses: actions/checkout@v4

      - name: Create K8s secrets
        run: |
          kubectl create secret generic medical-crm-secrets \
            --namespace medical-crm \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            --from-literal=KIMI_API_KEY="${{ secrets.KIMI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to K8s
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            server/k8s/deployment.yaml
            server/k8s/cronjobs.yaml
          images: |
            ghcr.io/${{ github.repository }}/medical-crm-api:${{ github.sha }}
