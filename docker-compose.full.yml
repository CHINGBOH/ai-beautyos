# =============================================================================
# AI BeautyOS — Joint deployment (BeautyOS + custom Hermes)
# =============================================================================
# This is an OVERLAY. It extends docker-compose.yml; it does not replace it.
#
# Usage:
#   IMAGE_TAG_WEB=sha-abc123 IMAGE_TAG_HERMES=sha-def456 \
#     docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
#
# What this overlay adds on top of the base compose:
#   * redis            — Hermes session / scratch state (no host port)
#   * hermes           — custom Hermes runtime (beautyos-hermes image)
#
# What it does NOT do:
#   * Move Tool Server out of the web container. MVP keeps it in-process
#     (#17). When extracted, add a `tool-server:` service here and point
#     hermes at it.
#   * Expose Hermes or Redis to the host. Both stay on the internal
#     network.
#
# See docs/deployment/joint-deployment.md for the full playbook.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: beautyos-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - beautyos-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  hermes:
    # Image is published by the beautyos-hermes repo. Tag is pinned via
    # IMAGE_TAG_HERMES so rollback is one env var.
    image: ghcr.io/chingboh/beautyos-hermes:${IMAGE_TAG_HERMES:-latest}
    container_name: beautyos-hermes
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BEAUTYOS_BASE: http://web:3000
      REDIS_URL: redis://redis:6379/0
      # Tenant scoping at runtime — set per deployment, not per image.
      BEAUTYOS_TENANT_ID: ${BEAUTYOS_TENANT_ID:-default}
      # Which behaviour profile to boot under. Must match a file under
      # the mounted config/policies/hermes/ directory.
      HERMES_POLICY_FILE: /opt/beautyos/config/policies/hermes/${HERMES_POLICY:-sales-assistant}.yaml
      HERMES_PROFILE_FILE: /opt/beautyos/config/hermes-profile.yaml
    volumes:
      # Mount the contract read-only. Hermes never writes to it.
      - ./config:/opt/beautyos/config:ro
      - ./docs/system-manifest.yaml:/opt/beautyos/docs/system-manifest.yaml:ro
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beautyos-internal
    # Hermes is internal-only. No `ports:`. Operators interact via the
    # web container, which exposes any user-facing Hermes endpoints
    # behind its own auth.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--spider", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
